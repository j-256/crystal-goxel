name: ci
on:
  push:
    # branches: [ master ] # Uncomment if you want to only run the workflow when pushing on to the master branch
  pull_request:
  workflow_dispatch:

jobs:
  windows_x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-glfw mingw-w64-x86_64-libtre-git mingw-w64-x86_64-zlib scons make git

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Crystal Goxel package
        run: |
          scripts/package-crystal-windows

      - name: Check native helper process contract
        timeout-minutes: 5
        run: |
          mkdir -p build
          windres -I. src/crystal-windows.rc build/host-manifest.o
          g++ -std=c++17 -Wall -Wextra -Werror -static \
            tests/crystal_host_test.cpp src/crystal_host.cpp \
            build/host-manifest.o -lole32 -o build/crystal-host-test.exe
          ./build/crystal-host-test.exe --bridge \
            'dist/Crystal Goxel Windows/Bridge/crystal-bridge.exe'

      - name: Check packaged helper
        shell: pwsh
        timeout-minutes: 10
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'Crystal Goxel 雪 spaces'
          Copy-Item -LiteralPath 'dist/Crystal Goxel Windows' -Destination $package -Recurse
          Push-Location $env:RUNNER_TEMP
          try {
            & "$package/Bridge/crystal-bridge.exe" test
            if ($LASTEXITCODE -ne 0) { throw 'Packaged bridge checks failed' }
            & "$package/CrystalGoxel.exe" --help
            if ($LASTEXITCODE -ne 0) { throw 'Portable editor launch failed' }
          } finally { Pop-Location }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crystal-goxel-windows-x64
          path: dist/Crystal Goxel Windows/
          if-no-files-found: error

  linux_x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install GLFW3, PKG Config, Git, Gtk3, LibPNG & SCONS
      run: |
        sudo apt-get install libglfw3-dev pkg-config git libgtk-3-dev \
        libpng-dev libpng16-16 scons libfuse2

    - name: Build Goxel
      run: |
        make release

    - name: Install
      run: |
        sudo make install

    - name: Build AppImage
      run: |
        make appimage

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: linux_x86_64_binary
        path: goxel
        if-no-files-found: error

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: appimage
        path: Goxel*.AppImage
        if-no-files-found: error

  osx_x86_64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install scons, glfw3 & tre
      run: brew install scons glfw tre

    - name: Build
      run: |
        make release

    - name: Compress artifact
      run: |
        zip goxel.zip goxel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: osx_binary
        path: ./goxel.zip
        if-no-files-found: error

    - name: Build with xcode
      run: |
        cd osx/goxel
        xcodebuild build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        cd build/Release
        tar -cvf goxel.app.tar goxel.app

    - name: Upload app Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: goxel-mac.app
        path: ./osx/goxel/build/Release/goxel.app.tar
        if-no-files-found: error

  Success: # Not Neccessary
    needs: [linux_x86_64, osx_x86_64, windows_x86_64]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
